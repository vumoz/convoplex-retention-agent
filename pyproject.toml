[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "convoplex-retention-agent"
version = "0.1.0"
description = "AI agent that wins back lapsed customers for Nigerian retailers. Built during the Meta AI Developer Hackathon, Oct 27 to Nov 4 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "httpx2>=2.0",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
convoplex = "convoplex.__main__:main"

[tool.setuptools]
packages = ["convoplex", "convoplex.integrations", "convoplex.synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
